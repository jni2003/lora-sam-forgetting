# AI generated workflow to run the test suite on every push
# Runs the tests on GitHub's machines on every push and pull request (free for public repos).
# The tests use tiny random models, so no checkpoints, data or GPU are needed.
name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      # CPU-only torch first: the default Linux torch includes CUDA and is several GB
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
